<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>ふたり分担</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#29343b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:4;background:#fffffff2;border-bottom:1px solid #ffedd5;padding:14px 16px;display:flex;justify-content:space-between}header small{display:block;color:#f97316;font-weight:800;letter-spacing:.12em}header b{font-size:21px}.status{border:0;background:transparent;color:#64748b}main{max-width:850px;margin:auto;padding:14px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #7c2d1210}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.big{font-size:20px;font-weight:900}.muted{font-size:12px;color:#78909c}.orange{color:#f97316;font-weight:800}.bar{height:11px;border-radius:10px;overflow:hidden;display:flex;background:#eee;margin-top:10px}.bar i:first-child{background:#f97316}.bar i:last-child{background:#fbbf24}.tabs,.days{display:flex;gap:6px;flex-wrap:wrap}.chip,.day{border:0;border-radius:99px;padding:8px 12px;background:#fff1e7;color:#c2410c;font-weight:800}.chip.on,.day.on,.primary{background:#f97316;color:#fff}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}label{display:block;font-size:12px;color:#64748b;margin-top:9px}input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #e5e7eb;border-radius:10px;background:white}.primary{border:0;border-radius:12px;padding:12px;font-weight:800}.full{width:100%;margin-top:12px}.delete{border:0;background:none}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ffedd5;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;padding:13px 2px;color:#94a3b8;font-weight:700;font-size:12px}.nav .on{color:#f97316}.hide{display:none}.modal{display:none;position:fixed;inset:0;background:#26323899;z-index:10;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.panel{width:min(420px,100%);padding:22px;background:#fff;border-radius:20px}.memo{background:#fff1e7;padding:10px;border-radius:12px;margin-top:8px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week button{border:0;border-radius:10px;padding:8px 2px}.week .on{background:#f97316;color:white}.task{border-left:5px solid #f97316}.calmemo{display:flex;gap:7px;margin-top:10px}.calmemo input{margin:0}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo-slot{border:2px solid #ffedd5;border-radius:16px;overflow:hidden;background:#fffaf6}.photo-slot h4{margin:0;padding:10px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.photo-empty{aspect-ratio:4/3;display:grid;place-items:center;color:#94a3b8}.photo-actions{padding:10px}.photo-actions input[type=file]{display:none}.pick{display:block;text-align:center;background:#fff1e7;color:#c2410c;border-radius:10px;padding:10px;font-weight:800}.progress{font-size:12px;color:#f97316;margin-top:7px}.mission{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa}.mission-result{text-align:center;padding:15px;border-radius:15px;background:#fff;margin:12px 0}.mission-result .person{font-size:28px;font-weight:900;color:#f97316}.candidate{display:flex;gap:7px;align-items:center;margin-top:7px}.candidate span{flex:1;background:#fff;padding:9px;border-radius:10px}.candidate button{border:0;background:none}.addline{display:flex;gap:7px}.addline input{margin-top:0}.addline button{width:auto}.nameedit{font-weight:800;font-size:17px}@media(max-width:600px){.grid,.fields,.photo-grid{grid-template-columns:1fr}}
</style></head><body><header><div><small>YUTA & KAHO</small><b>ふたり分担</b></div><button id="status" class="status">共有設定</button></header><main><section id="home"></section><section id="cal" class="hide"></section><section id="list" class="hide"></section><section id="add" class="hide"></section></main><nav class="nav"><button data-tab="home" class="on">⚖️ バランス</button><button data-tab="cal">📅 カレンダー</button><button data-tab="list">✅ 分担一覧</button><button data-tab="add">＋ 追加</button></nav><div id="modal" class="modal"><div class="panel"><h2>ふたりで共有</h2><p class="muted">両方の端末で同じ家族コードを入力してください。</p><label>家族コード<input id="code" autocomplete="off"></label><button id="connect" class="primary full">このコードで共有する</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script>
const cfg={apiKey:"AIzaSyCrc6r8m-kpjHBzZ4EDGngAemb-5EVzGEg",authDomain:"ykshare-cbb64.firebaseapp.com",projectId:"ykshare-cbb64",storageBucket:"ykshare-cbb64.firebasestorage.app",messagingSenderId:"1089125944461",appId:"1:1089125944461:web:64feb1ebbd5cbedb0da6c4"};firebase.initializeApp(cfg);const db=firebase.firestore(),storage=firebase.storage();
const P=['ゆた','かほ','共同'],D=['月','火','水','木','金','土','日'];const seed=[{id:1,type:'money',cat:'住まい',name:'家賃',owner:'ゆた',weight:5,amount:90000,memo:''},{id:2,type:'money',cat:'生活費',name:'光熱費',owner:'かほ',weight:2,amount:18000,memo:''},{id:3,type:'money',cat:'生活費',name:'食費',owner:'共同',weight:4,amount:50000,memo:''},{id:4,type:'chore',cat:'料理',name:'献立を考える',owner:'かほ',weight:3,days:['月','火','水','木','金'],memo:''},{id:5,type:'chore',cat:'料理',name:'料理を作る',owner:'かほ',weight:5,days:['月','火','水','木','金'],memo:''},{id:6,type:'chore',cat:'料理',name:'食器・台所の片付け',owner:'ゆた',weight:4,days:D.slice(),memo:''},{id:7,type:'chore',cat:'掃除',name:'リビング・床',owner:'共同',weight:3,days:['土'],memo:''},{id:8,type:'chore',cat:'洗濯',name:'洗う・干す・たたむ',owner:'共同',weight:4,days:['火','木','土'],memo:''},{id:9,type:'chore',cat:'ゴミ',name:'分別・ゴミ出し',owner:'ゆた',weight:3,days:['火','金'],memo:''}];const defaultMissions=['ポスト確認','段ボールを畳む','ゴミ箱チェック','テディ用品の補充'];let items=JSON.parse(localStorage.getItem('fb-items')||'null')||seed,photos={},missions=defaultMissions.slice(),draw=null,code=localStorage.getItem('fb-code')||'',ref=null,unsub=null,cal=new Date(),filter='all';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0),dow=d=>D[(d.getDay()+6)%7];
function connect(v){code=String(v).toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,24);if(!code)return alert('家族コードを入力してください');localStorage.setItem('fb-code',code);ref=db.collection('families').doc(code);if(unsub)unsub();unsub=ref.onSnapshot(async s=>{if(s.exists){let d=s.data();if(Array.isArray(d.items))items=d.items;photos=d.teddyPhotos||{};missions=Array.isArray(d.missions)&&d.missions.length?d.missions:defaultMissions.slice();draw=d.missionDraw||null;localStorage.setItem('fb-items',JSON.stringify(items));render()}else await ref.set({items,teddyPhotos:{},missions,missionDraw:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$('#status').textContent='● 同期中：'+code;$('#modal').classList.remove('show')},()=>{$('#status').textContent='同期エラー';alert('Firebaseのルールと通信状態を確認してください')})}
function cloud(data){if(ref)return ref.set({...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}function save(){localStorage.setItem('fb-items',JSON.stringify(items));render();cloud({items})}
function addMission(){let v=$('#newMission').value.trim();if(!v)return;if(!missions.includes(v))missions.push(v);cloud({missions});render()}function deleteMission(i){missions.splice(i,1);cloud({missions});render()}function runDraw(){if(!missions.length)return alert('先にミッション候補を追加してください');draw={task:missions[Math.floor(Math.random()*missions.length)],owner:Math.random()<.5?'ゆた':'かほ',drawnAt:Date.now()};cloud({missionDraw:draw});render()}
async function compress(file){let img=await createImageBitmap(file),m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}async function uploadPhoto(who,file){if(!ref)return alert('先に家族コードで共有してください');if(!file)return;let st=$('#prog-'+who);st.textContent='画像を圧縮中...';try{let blob=await compress(file),r=storage.ref(`teddy/${code}/${who}.jpg`),task=r.put(blob,{contentType:'image/jpeg'});task.on('state_changed',s=>st.textContent=`アップロード ${Math.round(s.bytesTransferred/s.totalBytes*100)}%`,()=>st.textContent='アップロード失敗',async()=>{let url=await r.getDownloadURL();photos[who]={url,updatedAt:Date.now()};await cloud({teddyPhotos:photos});st.textContent='共有しました'})}catch(e){st.textContent='写真処理に失敗しました'}}
function total(t,o){return items.filter(i=>i.type===t).reduce((s,i)=>s+(i.owner===o?(t==='money'?i.amount:i.weight):i.owner==='共同'?(t==='money'?i.amount:i.weight)/2:0),0)}function bal(t,a,b,f){let p=Math.round(a/(a+b||1)*100);return `<div class="card"><h3>${t}</h3><div class="row"><div><small>ゆた</small><div class="big">${f(a)}</div><b class="orange">${p}%</b></div><div style="text-align:right"><small>かほ</small><div class="big">${f(b)}</div><b class="orange">${100-p}%</b></div></div><div class="bar"><i style="width:${p}%"></i><i style="width:${100-p}%"></i></div></div>`}
function slot(w,l){let p=photos[w];return `<div class="photo-slot"><h4>${l}の1枚</h4>${p?.url?`<img class="photo" src="${p.url}">`:`<div class="photo-empty">まだ写真がありません</div>`}<div class="photo-actions"><label class="pick">📷 写真を選ぶ<input type="file" accept="image/*" data-photo="${w}"></label><div id="prog-${w}" class="progress"></div></div></div>`}
function missionCard(){return `<div class="card mission"><div class="row"><h3>🎲 本日のミッション抽選</h3><span class="muted">結果はふたりに共有</span></div>${draw?`<div class="mission-result"><div class="muted">${esc(draw.task)} の担当は</div><div class="person">${draw.owner}</div></div>`:`<div class="mission-result muted">まだ抽選されていません</div>`}<button class="primary full" id="drawBtn">${draw?'もう一度抽選':'抽選する'}</button><h4>ミッション候補</h4><div class="addline"><input id="newMission" placeholder="地味だけど必要なことを入力"><button class="primary" id="addMission">追加</button></div>${missions.map((m,i)=>`<div class="candidate"><span>${esc(m)}</span><button data-delmission="${i}">🗑️</button></div>`).join('')}</div>`}
function renderHome(){let a=total('money','ゆた'),b=total('money','かほ'),c=total('chore','ゆた'),d=total('chore','かほ');$('#home').innerHTML=`<div class="grid">${bal('💴 お金の負担',a,b,yen)}${bal('🏠 家事の負担',c,d,n=>n.toFixed(1)+' pt')}</div>${missionCard()}<div class="card"><div class="row"><h3>🐶 今日のテディ</h3><span class="muted">最新1枚を上書き共有</span></div><div class="photo-grid">${slot('yuta','ゆた')}${slot('kaho','かほ')}</div></div><div class="card"><h3>💬 気づきメモ</h3>${items.filter(i=>i.memo).map(i=>`<div class="memo"><b>${esc(i.name)}</b><br>${esc(i.memo)}</div>`).join('')||'<p class="muted">メモはありません</p>'}</div>`}
function editor(i){return `<div class="card"><div class="row"><small>${esc(i.cat)}</small><button class="delete" data-del="${i.id}">🗑️</button></div><label>項目名<input class="nameedit" value="${esc(i.name)}" data-id="${i.id}" data-k="name"></label><div class="fields"><label>担当<select data-id="${i.id}" data-k="owner">${P.map(x=>`<option ${x===i.owner?'selected':''}>${x}</option>`).join('')}</select></label><label>ウェイト ${i.weight}<input type="range" min="1" max="5" value="${i.weight}" data-id="${i.id}" data-k="weight"></label>${i.type==='money'?`<label>月額<input type="number" value="${i.amount||0}" data-id="${i.id}" data-k="amount"></label>`:''}</div>${i.type==='chore'?`<div class="days">${D.map(x=>`<button class="day ${(i.days||[]).includes(x)?'on':''}" data-day="${x}" data-id="${i.id}">${x}</button>`).join('')}</div>`:''}<label>共有メモ<input value="${esc(i.memo)}" data-id="${i.id}" data-k="memo"></label></div>`}function renderList(){$('#list').innerHTML=`<div class="tabs">${[['all','すべて'],['money','お金'],['chore','家事']].map(x=>`<button class="chip ${filter===x[0]?'on':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><br>${items.filter(i=>filter==='all'||i.type===filter).map(editor).join('')}`}
function renderCal(){let mon=new Date(cal);mon.setDate(cal.getDate()-((cal.getDay()+6)%7));let ts=items.filter(i=>i.type==='chore'&&(i.days||[]).includes(dow(cal)));$('#cal').innerHTML=`<div class="card"><div class="row"><button class="chip" data-shift="-1">‹</button><h2>${cal.getFullYear()}年${cal.getMonth()+1}月${cal.getDate()}日（${dow(cal)}）</h2><button class="chip" data-shift="1">›</button></div><div class="week">${D.map((x,n)=>{let d=new Date(mon);d.setDate(mon.getDate()+n);return `<button class="${d.toDateString()===cal.toDateString()?'on':''}" data-date="${d.toISOString()}">${x}<br><b>${d.getDate()}</b></button>`}).join('')}</div></div>${ts.map(i=>`<div class="card task"><b>${esc(i.name)}</b><span style="float:right" class="orange">${i.owner}</span>${i.memo?`<div class="muted">${esc(i.memo)}</div>`:''}<div class="calmemo"><input id="cm-${i.id}" placeholder="気づきコメントを入力"><button class="primary" data-cmemo="${i.id}">共有</button></div></div>`).join('')||'<div class="card muted">設定された家事はありません</div>'}`}
function renderAdd(){$('#add').innerHTML=`<div class="card"><h2>項目を追加</h2><label>種類<select id="nt"><option value="chore">家事</option><option value="money">お金</option></select></label><label>項目名<input id="nn"></label><label>カテゴリ<input id="nc" value="その他"></label><label>担当<select id="no">${P.map(x=>`<option>${x}</option>`).join('')}</select></label><label>ウェイト<input id="nw" type="number" min="1" max="5" value="3"></label><label>月額<input id="na" type="number" value="0"></label><label>曜日</label><div id="nd" class="days">${D.map(x=>`<button class="day" data-newday="${x}">${x}</button>`).join('')}</div><label>共有メモ<input id="nm"></label><button id="addbtn" class="primary full">追加する</button></div>`}function render(){renderHome();renderList();renderCal();renderAdd()}render();
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b))}if(b.id==='drawBtn')runDraw();if(b.id==='addMission')addMission();if(b.dataset.delmission!==undefined)deleteMission(Number(b.dataset.delmission));if(b.dataset.filter){filter=b.dataset.filter;renderList()}if(b.dataset.del){items=items.filter(i=>i.id!=b.dataset.del);save()}if(b.dataset.day){let i=items.find(x=>x.id==b.dataset.id);i.days=i.days.includes(b.dataset.day)?i.days.filter(x=>x!==b.dataset.day):[...i.days,b.dataset.day];save()}if(b.dataset.shift){cal.setDate(cal.getDate()+Number(b.dataset.shift));renderCal()}if(b.dataset.date){cal=new Date(b.dataset.date);renderCal()}if(b.dataset.newday)b.classList.toggle('on');if(b.dataset.cmemo){let i=items.find(x=>x.id==b.dataset.cmemo),v=$('#cm-'+i.id).value.trim();if(v){i.memo=i.memo?i.memo+' / '+v:v;save()}}if(b.id==='addbtn'){let n=$('#nn').value.trim();if(!n)return alert('項目名を入力してください');items.push({id:Date.now(),type:$('#nt').value,cat:$('#nc').value||'その他',name:n,owner:$('#no').value,weight:Number($('#nw').value),amount:Number($('#na').value),days:[...document.querySelectorAll('#nd .on')].map(x=>x.dataset.newday),memo:$('#nm').value});save()}});document.addEventListener('change',e=>{if(e.target.dataset.photo)uploadPhoto(e.target.dataset.photo,e.target.files[0]);let id=e.target.dataset.id,k=e.target.dataset.k;if(id&&k){let i=items.find(x=>x.id==id);i[k]=['weight','amount'].includes(k)?Number(e.target.value):e.target.value;save()}});document.addEventListener('keydown',e=>{if(e.target.id==='newMission'&&e.key==='Enter')addMission()});$('#status').onclick=()=>{$('#code').value=code;$('#modal').classList.add('show')};$('#connect').onclick=()=>connect($('#code').value);if(code)connect(code);else $('#modal').classList.add('show');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
