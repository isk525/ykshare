<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><link rel="manifest" href="manifest.webmanifest"><title>ふたり分担</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#29343b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:4;background:#fffffff2;border-bottom:1px solid #ffedd5;padding:14px 16px;display:flex;justify-content:space-between}header small{display:block;color:#f97316;font-weight:800;letter-spacing:.12em}main{max-width:850px;margin:auto;padding:14px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #7c2d1210}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:12px;color:#78909c}.orange{color:#f97316;font-weight:800}.big{font-size:20px;font-weight:900}.bar{height:11px;border-radius:10px;overflow:hidden;display:flex;background:#eee}.bar i:first-child{background:#f97316}.bar i:last-child{background:#fbbf24}.chip,.day,.primary{border:0;border-radius:12px;padding:10px;font-weight:800}.chip,.day{background:#fff1e7;color:#c2410c}.on,.primary{background:#f97316!important;color:#fff!important}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;font-size:12px;color:#64748b;margin-top:8px}input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.full{width:100%;margin-top:12px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:#fff}.nav button{border:0;background:#fff;padding:14px 2px;color:#94a3b8}.hide{display:none}.modal{display:none;position:fixed;inset:0;background:#26323899;z-index:10;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.panel{width:min(420px,100%);padding:22px;background:#fff;border-radius:20px}.memo{background:#fff1e7;padding:10px;border-radius:12px;margin:8px 0}.days,.tabs,.addline{display:flex;gap:6px;flex-wrap:wrap}.day{border-radius:99px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week button{border:0;border-radius:10px;padding:8px 2px}.mission{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa}.stage{min-height:116px;display:grid;place-items:center;text-align:center;background:#fff;border-radius:15px;margin:12px 0}.person{font-size:30px;font-weight:900;color:#f97316}.stage.spin{animation:pulse .45s infinite alternate}.stage.spin .person{animation:flip .14s infinite}@keyframes pulse{to{transform:scale(1.02);box-shadow:0 0 0 9px #f9731608}}@keyframes flip{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:translateY(-2px)}}.candidate{display:flex;gap:7px;margin-top:7px}.candidate span{flex:1;background:#fff;padding:9px;border-radius:10px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover}.slot{border:2px solid #ffedd5;border-radius:14px;overflow:hidden}.slot>div{padding:10px}.slot input{display:none}.empty{aspect-ratio:4/3;display:grid!important;place-items:center;color:#94a3b8}.calmemo{display:flex;gap:6px}.task{border-left:5px solid #f97316}@media(max-width:600px){.grid,.fields,.photo-grid{grid-template-columns:1fr}}
</style></head><body><header><div><small>YUTA & KAHO</small><b>ふたり分担</b></div><button id="status" class="chip">共有設定</button></header><main><section id="home"></section><section id="cal" class="hide"></section><section id="list" class="hide"></section><section id="add" class="hide"></section></main><nav class="nav"><button data-tab="home" class="on">⚖️ バランス</button><button data-tab="cal">📅 カレンダー</button><button data-tab="list">✅ 分担一覧</button><button data-tab="add">＋ 追加</button></nav><div id="modal" class="modal"><div class="panel"><h2>ふたりで共有</h2><label>家族コード<input id="code"></label><button id="connect" class="primary full">このコードで共有する</button></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:"AIzaSyCrc6r8m-kpjHBzZ4EDGngAemb-5EVzGEg",authDomain:"ykshare-cbb64.firebaseapp.com",projectId:"ykshare-cbb64",storageBucket:"ykshare-cbb64.firebasestorage.app",messagingSenderId:"1089125944461",appId:"1:1089125944461:web:64feb1ebbd5cbedb0da6c4"};firebase.initializeApp(cfg);const db=firebase.firestore(),P=['ゆた','かほ','共同'],D=['月','火','水','木','金','土','日'];let items=JSON.parse(localStorage.getItem('fb-items')||'[]'),missions=['ポスト確認','段ボールを畳む','ゴミ箱チェック','テディ用品の補充'],photos={},draw=null,code=localStorage.getItem('fb-code')||'',ref,unsub,cal=new Date(),filter='all',drawing=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0),dow=d=>D[(d.getDay()+6)%7];
function cloud(x){return ref&&ref.set({...x,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}function connect(v){code=String(v).toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!code)return;localStorage.setItem('fb-code',code);ref=db.collection('families').doc(code);if(unsub)unsub();unsub=ref.onSnapshot(async s=>{if(s.exists){let d=s.data();items=d.items||items;missions=d.missions||missions;photos=d.teddyPhotos||{};draw=d.missionDraw||null;render()}else await ref.set({items,missions,teddyPhotos:{}});$('#status').textContent='● 同期中：'+code;$('#modal').classList.remove('show')})}function save(){localStorage.setItem('fb-items',JSON.stringify(items));render();cloud({items})}
function total(t,o){return items.filter(i=>i.type===t).reduce((s,i)=>s+(i.owner===o?(t==='money'?i.amount:i.weight):i.owner==='共同'?(t==='money'?i.amount:i.weight)/2:0),0)}function bal(t,a,b,f){let p=Math.round(a/(a+b||1)*100);return `<div class="card"><h3>${t}</h3><div class="row"><div class="big">${f(a)}<br><small>ゆた ${p}%</small></div><div class="big">${f(b)}<br><small>かほ ${100-p}%</small></div></div><div class="bar"><i style="width:${p}%"></i><i style="width:${100-p}%"></i></div></div>`}
function mission(){let sel=draw&&missions.includes(draw.task)?draw.task:(missions[0]||'');return `<div class="card mission"><h3>🎲 本日のミッション抽選</h3><p class="muted">やることを選んで、担当だけを抽選します</p><label>やること<select id="missionSelect">${missions.map(m=>`<option ${m===sel?'selected':''}>${esc(m)}</option>`).join('')}</select></label><div id="stage" class="stage"><div><small>${draw?esc(draw.task)+' の担当は':'担当を抽選します'}</small><div id="person" class="person">${draw?draw.owner:'？'}</div></div></div><button id="draw" class="primary full">この内容で抽選する</button><p class="muted" style="text-align:center">約2秒間、ゆた・かほが交互に表示されます</p><h4>ミッション候補</h4><div class="addline"><input id="newMission" placeholder="新しい候補を入力"><button id="addMission" class="primary">追加</button></div>${missions.map((m,i)=>`<div class="candidate"><span>${esc(m)}</span><button data-dm="${i}">🗑️</button></div>`).join('')}</div>`}function runDraw(){if(drawing)return;let task=$('#missionSelect').value;if(!task)return;drawing=true;let st=$('#stage'),pe=$('#person'),bt=$('#draw'),n=0;st.classList.add('spin');bt.disabled=true;bt.textContent='抽選中...';let timer=setInterval(()=>pe.textContent=['ゆた','かほ'][n++%2],110);setTimeout(async()=>{clearInterval(timer);let owner=Math.random()<.5?'ゆた':'かほ';pe.textContent=owner;st.classList.remove('spin');draw={task,owner,drawnAt:Date.now()};await cloud({missionDraw:draw});drawing=false;bt.disabled=false;bt.textContent='この内容で抽選する'},2000)}
async function photo(w,f){let im=await createImageBitmap(f),m=480,z=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos[w]={data:c.toDataURL('image/jpeg',.68),updatedAt:Date.now()};await cloud({teddyPhotos:photos});render()}function slot(w,l){let p=photos[w];return `<div class="slot"><div><b>${l}の1枚</b></div>${p?.data?`<img class="photo" src="${p.data}">`:`<div class="empty">まだ写真がありません</div>`}<div><label class="chip" style="display:block;text-align:center">📷 写真を選ぶ<input type="file" accept="image/*" data-photo="${w}"></label></div></div>`}
function home(){let a=total('money','ゆた'),b=total('money','かほ'),c=total('chore','ゆた'),d=total('chore','かほ');$('#home').innerHTML=`<div class="grid">${bal('💴 お金の負担',a,b,yen)}${bal('🏠 家事の負担',c,d,n=>n.toFixed(1)+' pt')}</div><div class="card"><h3>💬 気づきメモ</h3>${items.filter(i=>i.memo).map(i=>`<div class="memo"><b>${esc(i.name)}</b><br>${esc(i.memo)}</div>`).join('')||'<p class="muted">メモはありません</p>'}</div>${mission()}<div class="card"><h3>🐶 今日のテディ</h3><div class="photo-grid">${slot('yuta','ゆた')}${slot('kaho','かほ')}</div></div>`}
function editor(i){return `<div class="card"><button data-del="${i.id}" style="float:right;border:0;background:none">🗑️</button><label>項目名<input value="${esc(i.name)}" data-id="${i.id}" data-k="name"></label><div class="fields"><label>担当<select data-id="${i.id}" data-k="owner">${P.map(x=>`<option ${x===i.owner?'selected':''}>${x}</option>`).join('')}</select></label><label>ウェイト<input type="range" min="1" max="5" value="${i.weight}" data-id="${i.id}" data-k="weight"></label>${i.type==='money'?`<label>月額<input type="number" value="${i.amount||0}" data-id="${i.id}" data-k="amount"></label>`:''}</div>${i.type==='chore'?`<div class="days">${D.map(x=>`<button class="day ${(i.days||[]).includes(x)?'on':''}" data-day="${x}" data-id="${i.id}">${x}</button>`).join('')}</div>`:''}<label>共有メモ<input value="${esc(i.memo||'')}" data-id="${i.id}" data-k="memo"></label></div>`}function list(){$('#list').innerHTML=`<div class="tabs">${[['all','すべて'],['money','お金'],['chore','家事']].map(x=>`<button class="chip ${filter===x[0]?'on':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><br>${items.filter(i=>filter==='all'||i.type===filter).map(editor).join('')}`}
function calendar(){let mon=new Date(cal);mon.setDate(cal.getDate()-((cal.getDay()+6)%7));let ts=items.filter(i=>i.type==='chore'&&(i.days||[]).includes(dow(cal)));$('#cal').innerHTML=`<div class="card"><div class="row"><button class="chip" data-shift="-1">‹</button><h3>${cal.getMonth()+1}月${cal.getDate()}日（${dow(cal)}）</h3><button class="chip" data-shift="1">›</button></div><div class="week">${D.map((x,n)=>{let d=new Date(mon);d.setDate(mon.getDate()+n);return `<button data-date="${d.toISOString()}" class="${d.toDateString()===cal.toDateString()?'on':''}">${x}<br>${d.getDate()}</button>`}).join('')}</div></div>${ts.map(i=>`<div class="card task"><b>${esc(i.name)}</b><span style="float:right">${i.owner}</span><div>${esc(i.memo||'')}</div><div class="calmemo"><input id="cm-${i.id}" placeholder="気づきコメント"><button class="primary" data-cmemo="${i.id}">共有</button></div></div>`).join('')}`}
function add(){ $('#add').innerHTML=`<div class="card"><h2>項目を追加</h2><label>種類<select id="nt"><option value="chore">家事</option><option value="money">お金</option></select></label><label>項目名<input id="nn"></label><label>カテゴリ<input id="nc" value="その他"></label><label>担当<select id="no">${P.map(x=>`<option>${x}</option>`).join('')}</select></label><label>ウェイト<input id="nw" type="number" value="3"></label><label>月額<input id="na" type="number" value="0"></label><div id="nd" class="days">${D.map(x=>`<button class="day" data-newday="${x}">${x}</button>`).join('')}</div><label>共有メモ<input id="nm"></label><button id="addbtn" class="primary full">追加</button></div>`}function render(){home();list();calendar();add()}render();
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b))}if(b.id==='draw')runDraw();if(b.id==='addMission'){let v=$('#newMission').value.trim();if(v&&!missions.includes(v)){missions.push(v);cloud({missions});render()}}if(b.dataset.dm!==undefined){missions.splice(+b.dataset.dm,1);cloud({missions});render()}if(b.dataset.filter){filter=b.dataset.filter;list()}if(b.dataset.del){items=items.filter(i=>i.id!=b.dataset.del);save()}if(b.dataset.day){let i=items.find(x=>x.id==b.dataset.id);i.days=i.days.includes(b.dataset.day)?i.days.filter(x=>x!==b.dataset.day):[...i.days,b.dataset.day];save()}if(b.dataset.shift){cal.setDate(cal.getDate()+(+b.dataset.shift));calendar()}if(b.dataset.date){cal=new Date(b.dataset.date);calendar()}if(b.dataset.newday)b.classList.toggle('on');if(b.dataset.cmemo){let i=items.find(x=>x.id==b.dataset.cmemo),v=$('#cm-'+i.id).value.trim();if(v){i.memo=i.memo?i.memo+' / '+v:v;save()}}if(b.id==='addbtn'){let n=$('#nn').value.trim();if(!n)return;items.push({id:Date.now(),type:$('#nt').value,cat:$('#nc').value,name:n,owner:$('#no').value,weight:+$('#nw').value,amount:+$('#na').value,days:[...document.querySelectorAll('#nd .on')].map(x=>x.dataset.newday),memo:$('#nm').value});save()}});document.addEventListener('change',e=>{if(e.target.dataset.photo)photo(e.target.dataset.photo,e.target.files[0]);let i=items.find(x=>x.id==e.target.dataset.id),k=e.target.dataset.k;if(i&&k){i[k]=['weight','amount'].includes(k)?+e.target.value:e.target.value;save()}});$('#status').onclick=()=>{$('#code').value=code;$('#modal').classList.add('show')};$('#connect').onclick=()=>connect($('#code').value);if(code)connect(code);else $('#modal').classList.add('show');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
