<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>ふたり分担</title>
<style>
:root{--o:#f97316;--ol:#fff1e7;--bg:#fffaf4;--ink:#263238;--muted:#78909c;--white:#fff;--green:#34a853;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:820px;margin:auto;padding-bottom:88px}.top{position:sticky;top:0;z-index:4;background:#ffffffef;border-bottom:1px solid #ffedd5;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}.brand small{display:block;color:var(--o);font-weight:800;letter-spacing:.14em}.brand b{font-size:21px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}.sync{font-size:12px;color:var(--muted)}main{padding:16px}.grid{display:grid;gap:13px}.balance-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 14px #7c2d1210}.card h2,.card h3{margin:0}.icon{display:inline-grid;place-items:center;background:var(--ol);width:36px;height:36px;border-radius:11px;margin-right:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:12px}.big{font-size:20px;font-weight:900}.pct{font-weight:800;color:var(--o)}.bar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:#eee;margin-top:10px}.bar i:first-child{background:var(--o)}.bar i:last-child{background:var(--amber)}.memo{background:var(--ol);border-radius:13px;padding:11px;margin-top:9px}.memo b{font-size:12px;color:#c2410c}.list{display:grid;gap:12px}.item-head{display:flex;justify-content:space-between;gap:8px}.pill{border:0;border-radius:99px;padding:8px 13px;background:#fff;color:#555;font-weight:700}.pill.on{background:var(--o);color:#fff}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #e5e7eb;border-radius:11px;background:#fff;color:var(--ink)}input[type=range]{padding:0;accent-color:var(--o)}.days{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.day{width:34px;height:34px;border:0;border-radius:50%;background:#f1f2f4;color:#76808b;font-size:12px;font-weight:800}.day.on{background:var(--o);color:#fff}.danger{border:0;background:transparent;color:#c8cdd2;font-size:19px}.primary{border:0;background:var(--o);color:#fff;padding:13px 16px;border-radius:12px;font-weight:800}.full{width:100%}.calendar-top{display:flex;align-items:center;justify-content:space-between;text-align:center}.arrow{border:0;background:var(--ol);color:var(--o);width:42px;height:42px;border-radius:50%;font-size:22px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}.date{border:0;border-radius:11px;padding:8px 1px;background:var(--ol)}.date.on{background:var(--o);color:#fff}.task{display:flex;align-items:center;gap:10px}.who{margin-left:auto;background:var(--ol);color:#c2410c;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.stripe{width:5px;height:42px;background:var(--o);border-radius:99px}.empty{text-align:center;color:var(--muted);padding:28px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ffedd5;display:grid;grid-template-columns:repeat(4,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;padding:10px 2px;color:#94a3b8;font-size:11px;font-weight:800}.nav button.on{color:var(--o)}.nav span{display:block;font-size:20px}.hide{display:none!important}.install{display:none;margin:12px 16px 0;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px}.install.show{display:flex;align-items:center;justify-content:space-between;gap:8px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#263238;color:#fff;border-radius:99px;padding:10px 16px;display:none;z-index:9}.toast.show{display:block}@media(max-width:620px){.balance-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.card{padding:14px}main{padding:12px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><small>YUTA & KAHO</small><b>ふたり分担</b></div><div class="sync"><i class="dot"></i>この端末に保存</div></header>
<div id="installBox" class="install"><span><b>ホーム画面に追加</b><br><small>アプリとして利用できます</small></span><button id="installBtn" class="primary">インストール</button></div>
<main><section id="overview"></section><section id="calendar" class="hide"></section><section id="items" class="hide"></section><section id="add" class="hide"></section></main>
</div><nav class="nav"><button data-tab="overview" class="on"><span>⚖️</span>バランス</button><button data-tab="calendar"><span>📅</span>カレンダー</button><button data-tab="items"><span>✅</span>分担一覧</button><button data-tab="add"><span>＋</span>追加</button></nav><div id="toast" class="toast"></div>
<script>
const PEOPLE=['ゆた','かほ','共同'], DAYS=['月','火','水','木','金','土','日'];
const seed=[
{id:1,type:'money',cat:'住まい',name:'家賃',owner:'ゆた',weight:5,amount:90000,memo:''},{id:2,type:'money',cat:'生活費',name:'光熱費',owner:'かほ',weight:2,amount:18000,memo:'電気代が少し上がった'},{id:3,type:'money',cat:'生活費',name:'食費',owner:'共同',weight:4,amount:50000,memo:''},{id:4,type:'money',cat:'生活費',name:'外食',owner:'共同',weight:2,amount:15000,memo:''},{id:5,type:'money',cat:'生活費',name:'日用品',owner:'かほ',weight:2,amount:10000,memo:''},{id:6,type:'money',cat:'移動',name:'車',owner:'ゆた',weight:3,amount:25000,memo:'次回オイル交換確認'},{id:7,type:'money',cat:'ペット',name:'ペット費',owner:'共同',weight:2,amount:12000,memo:''},
{id:8,type:'chore',cat:'料理',name:'献立を考える',owner:'かほ',weight:3,days:['月','火','水','木','金'],memo:'週末に翌週分を相談'},{id:9,type:'chore',cat:'料理',name:'料理を作る',owner:'かほ',weight:5,days:['月','火','水','木','金'],memo:'平日は簡単な献立中心'},{id:10,type:'chore',cat:'料理',name:'食器・台所の片付け',owner:'ゆた',weight:4,days:DAYS.slice(),memo:''},{id:11,type:'chore',cat:'掃除',name:'リビング・床',owner:'共同',weight:3,days:['土'],memo:'土曜を掃除デーにする'},{id:12,type:'chore',cat:'掃除',name:'風呂・洗面所',owner:'ゆた',weight:3,days:['日'],memo:'排水口も確認'},{id:13,type:'chore',cat:'掃除',name:'トイレ',owner:'かほ',weight:2,days:['土'],memo:''},{id:14,type:'chore',cat:'洗濯',name:'洗う・干す・たたむ',owner:'共同',weight:4,days:['火','木','土'],memo:''},{id:15,type:'chore',cat:'ゴミ',name:'分別・ゴミ出し',owner:'ゆた',weight:3,days:['火','金'],memo:'資源ごみの日に注意'},{id:16,type:'chore',cat:'ペット',name:'ごはん・水',owner:'共同',weight:3,days:DAYS.slice(),memo:''},{id:17,type:'chore',cat:'ペット',name:'トイレ掃除',owner:'ゆた',weight:3,days:['月','水','金','日'],memo:''},{id:18,type:'chore',cat:'ペット',name:'トリマー・通院',owner:'かほ',weight:2,days:[],memo:'次回予約を確認'}];
let items=JSON.parse(localStorage.getItem('futari-items')||'null')||seed, filter='all', cal=new Date(), draft={type:'chore',cat:'その他',name:'',owner:'共同',weight:3,amount:0,days:[],memo:''};
const $=s=>document.querySelector(s), yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(msg='保存しました'){localStorage.setItem('futari-items',JSON.stringify(items));toast(msg);renderAll()};function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function totals(type,owner){return items.filter(i=>i.type===type).reduce((s,i)=>s+(i.owner===owner?(type==='money'?i.amount:i.weight):i.owner==='共同'?(type==='money'?i.amount:i.weight)/2:0),0)}
function balance(title,a,b,fmt,icon){let total=a+b||1,p=Math.round(a/total*100);return `<div class="card"><h3><span class="icon">${icon}</span>${title}</h3><div class="row" style="margin-top:15px"><div><span class="muted">ゆた</span><div class="big">${fmt(a)}</div><div class="pct">${p}%</div></div><div style="text-align:right"><span class="muted">かほ</span><div class="big">${fmt(b)}</div><div class="pct">${100-p}%</div></div></div><div class="bar"><i style="width:${p}%"></i><i style="width:${100-p}%"></i></div></div>`}
function renderOverview(){let my=totals('money','ゆた'),mk=totals('money','かほ'),cy=totals('chore','ゆた'),ck=totals('chore','かほ');$('#overview').innerHTML=`<div class="grid balance-grid">${balance('お金の負担',my,mk,yen,'💴')}${balance('家事の負担',cy,ck,n=>n.toFixed(1)+' pt','🏠')}</div><div class="card" style="margin-top:13px"><h3>💬 気づきメモ</h3><p class="muted">次に気づけるように、ふたりで共有</p>${items.filter(i=>i.memo).slice(0,6).map(i=>`<div class="memo"><div class="row"><b>${esc(i.name)}</b><span class="muted">担当：${i.owner}</span></div><div>${esc(i.memo)}</div></div>`).join('')||'<div class="empty">メモはありません</div>'}</div>`}
function values(i){return `<div class="fields"><label>担当<select data-id="${i.id}" data-key="owner">${PEOPLE.map(p=>`<option ${p===i.owner?'selected':''}>${p}</option>`).join('')}</select></label><label>ウェイト：${i.weight}<input data-id="${i.id}" data-key="weight" type="range" min="1" max="5" value="${i.weight}"></label>${i.type==='money'?`<label>月額<input data-id="${i.id}" data-key="amount" type="number" value="${i.amount||0}"></label>`:''}</div>${i.type==='chore'?`<div><span class="muted">曜日</span><div class="days">${DAYS.map(d=>`<button class="day ${(i.days||[]).includes(d)?'on':''}" data-day="${d}" data-id="${i.id}">${d}</button>`).join('')}</div></div>`:''}<label style="display:block;margin-top:10px">共有メモ<input data-id="${i.id}" data-key="memo" value="${esc(i.memo)}" placeholder="気づいたことをメモ"></label>`}
function renderItems(){let list=items.filter(i=>filter==='all'||i.type===filter);$('#items').innerHTML=`<div class="filters">${[['all','すべて'],['money','お金'],['chore','家事']].map(x=>`<button class="pill ${filter===x[0]?'on':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="list">${list.map(i=>`<div class="card"><div class="item-head"><div><span class="muted">${esc(i.cat)}</span><h3>${esc(i.name)}</h3></div><button class="danger" data-del="${i.id}">🗑</button></div>${values(i)}</div>`).join('')}</div>`}
function dow(d){return DAYS[(d.getDay()+6)%7]}function same(a,b){return a.toDateString()===b.toDateString()}
function renderCalendar(){let monday=new Date(cal);monday.setDate(cal.getDate()-((cal.getDay()+6)%7));let tasks=items.filter(i=>i.type==='chore'&&(i.days||[]).includes(dow(cal)));$('#calendar').innerHTML=`<div class="card"><div class="calendar-top"><button class="arrow" data-shift="-1">‹</button><div><div class="pct">${cal.getFullYear()}年 ${cal.getMonth()+1}月</div><div class="big">${cal.getDate()}日（${dow(cal)}）</div></div><button class="arrow" data-shift="1">›</button></div><div class="week">${DAYS.map((x,n)=>{let d=new Date(monday);d.setDate(monday.getDate()+n);return `<button class="date ${same(d,cal)?'on':''}" data-date="${d.toISOString()}"><small>${x}</small><br><b>${d.getDate()}</b></button>`}).join('')}</div></div><h3 style="margin:18px 0 10px">この日の家事 <span class="pct">${tasks.length}件</span></h3><div class="list">${tasks.map(i=>`<div class="card task"><i class="stripe"></i><div><span class="muted">${esc(i.cat)}</span><b style="display:block">${esc(i.name)}</b>${i.memo?`<small class="muted">${esc(i.memo)}</small>`:''}</div><span class="who">${i.owner}</span></div>`).join('')||'<div class="card empty">この日に設定された家事はありません</div>'}</div>`}
function draftDays(){return DAYS.map(d=>`<button type="button" class="day ${draft.days.includes(d)?'on':''}" data-draftday="${d}">${d}</button>`).join('')}
function renderAdd(){ $('#add').innerHTML=`<div class="card"><h2>項目を追加</h2><p class="muted">家庭に合わせて自由に増やせます</p><div class="filters"><button class="pill ${draft.type==='money'?'on':''}" data-dtype="money">お金</button><button class="pill ${draft.type==='chore'?'on':''}" data-dtype="chore">家事</button></div><label>項目名<input id="dname" value="${esc(draft.name)}" placeholder="例：買い物・在庫確認"></label><div class="fields"><label>カテゴリ<input id="dcat" value="${esc(draft.cat)}"></label><label>担当<select id="downer">${PEOPLE.map(p=>`<option ${p===draft.owner?'selected':''}>${p}</option>`).join('')}</select></label><label>ウェイト：<span id="dwv">${draft.weight}</span><input id="dweight" type="range" min="1" max="5" value="${draft.weight}"></label></div>${draft.type==='money'?`<label>月額<input id="damount" type="number" value="${draft.amount}"></label>`:`<div style="margin-top:10px"><span class="muted">曜日</span><div class="days">${draftDays()}</div></div>`}<label style="display:block;margin-top:10px">共有メモ<input id="dmemo" value="${esc(draft.memo)}"></label><button id="addBtn" class="primary full" style="margin-top:14px">＋ 追加する</button></div>`}
function renderAll(){renderOverview();renderItems();renderCalendar();renderAdd()}renderAll();
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));}if(b.dataset.filter){filter=b.dataset.filter;renderItems()}if(b.dataset.del){items=items.filter(i=>i.id!=b.dataset.del);save('削除しました')}if(b.dataset.day){let i=items.find(x=>x.id==b.dataset.id);i.days=i.days.includes(b.dataset.day)?i.days.filter(x=>x!==b.dataset.day):[...i.days,b.dataset.day];save()}if(b.dataset.shift){cal.setDate(cal.getDate()+Number(b.dataset.shift));renderCalendar()}if(b.dataset.date){cal=new Date(b.dataset.date);renderCalendar()}if(b.dataset.dtype){draft.type=b.dataset.dtype;renderAdd()}if(b.dataset.draftday){draft.days=draft.days.includes(b.dataset.draftday)?draft.days.filter(x=>x!==b.dataset.draftday):[...draft.days,b.dataset.draftday];renderAdd()}if(b.id==='addBtn'){draft.name=$('#dname').value.trim();draft.cat=$('#dcat').value.trim()||'その他';draft.owner=$('#downer').value;draft.weight=Number($('#dweight').value);draft.memo=$('#dmemo').value.trim();if(draft.type==='money')draft.amount=Number($('#damount').value);if(!draft.name)return toast('項目名を入力してください');items.push({...draft,id:Date.now()});draft={type:'chore',cat:'その他',name:'',owner:'共同',weight:3,amount:0,days:[],memo:''};save('追加しました')}})
document.addEventListener('change',e=>{let id=e.target.dataset.id,key=e.target.dataset.key;if(id&&key){let i=items.find(x=>x.id==id);i[key]=key==='weight'||key==='amount'?Number(e.target.value):e.target.value;save()}if(e.target.id==='dweight'){$('#dwv').textContent=e.target.value}})
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBox').classList.add('show')});$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBox').classList.remove('show')};window.addEventListener('appinstalled',()=>$('#installBox').classList.remove('show'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
